name: CI
run-name: CI

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  GOVULNCHECK_VERSION: v1.3.0
  REGISTRY: git.kurumi.world
  IMAGE_NAME: git.kurumi.world/kurumi/ktk-schedule

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - run: go mod download

      - run: go mod tidy -diff

      - run: go vet ./...

      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}

      - run: golangci-lint run

      - run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}

      - run: govulncheck ./...

      - run: go test -count=1 -race ./...

      - run: go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/bot

  image:
    needs: check
    if: success() && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: native
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        run: |
          rm -rf /tmp/ktk-schedule-image
          git clone --depth=1 --branch master ssh://git@git.kurumi.world/kurumi/ktk-schedule.git /tmp/ktk-schedule-image
          cd /tmp/ktk-schedule-image

      - name: Check Docker availability
        run: docker version

      - name: Login to Forgejo container registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "${REGISTRY}" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Build and push image
        run: |
          cd /tmp/ktk-schedule-image

          image_sha="${IMAGE_NAME}:${GITHUB_SHA}"
          image_latest="${IMAGE_NAME}:latest"

          docker build \
            --label "org.opencontainers.image.source=https://git.kurumi.world/kurumi/ktk-schedule" \
            -t "$image_sha" \
            -t "$image_latest" \
            .

          docker push "$image_sha"
          docker push "$image_latest"

  deploy:
    needs: image
    if: success() && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: native
    timeout-minutes: 15
    steps:
      - name: Deploy to VDS
        env:
          DEPLOY_NOTIFY_BOT_TOKEN: ${{ secrets.DEPLOY_NOTIFY_BOT_TOKEN }}
          DEPLOY_NOTIFY_CHAT_ID: ${{ secrets.DEPLOY_NOTIFY_CHAT_ID }}
        run: |
          notify_deploy() {
            if [ -z "${DEPLOY_NOTIFY_BOT_TOKEN:-}" ] || [ -z "${DEPLOY_NOTIFY_CHAT_ID:-}" ]; then
              return 0
            fi

            curl -fsS -X POST "https://api.telegram.org/bot${DEPLOY_NOTIFY_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${DEPLOY_NOTIFY_CHAT_ID}" \
              --data-urlencode "text=$1" >/dev/null || true
          }

          cd /home/forgejo-runner/ktk-schedule

          git fetch origin master
          git reset --hard origin/master
          export KTK_SCHEDULE_IMAGE="${IMAGE_NAME}:${GITHUB_SHA}"

          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "${REGISTRY}" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

          previous_image=$(docker inspect ktk-schedule --format '{{.Config.Image}}' 2>/dev/null || true)
          if [ -n "$previous_image" ]; then
            docker tag "$previous_image" ktk-schedule:rollback
            echo "rollback image tagged"
          fi

          BACKUP_DIR="/home/forgejo-runner/ktk-schedule/backups" \
            BACKUP_KEEP_COUNT=10 \
            BACKUP_KEEP_DAYS=30 \
            scripts/backup-sqlite.sh

          docker pull "$KTK_SCHEDULE_IMAGE"
          docker compose up -d --no-build

          for i in $(seq 1 30); do
            health=$(docker inspect --format='{{.State.Health.Status}}' ktk-schedule 2>/dev/null)
            if [ "$health" = "healthy" ]; then
              echo "container is healthy"
              notify_deploy "ktk-schedule deploy succeeded: ${GITHUB_SHA}"
              docker image rm ktk-schedule:rollback 2>/dev/null || true
              docker image prune -f
              docker builder prune --filter "until=24h" -f
              exit 0
            fi
            sleep 2
          done
          echo "container failed to become healthy"
          docker compose logs --tail=50

          if docker image inspect ktk-schedule:rollback >/dev/null 2>&1; then
            echo "rolling back to previous image"
            docker tag ktk-schedule:rollback "$KTK_SCHEDULE_IMAGE"
            docker compose up -d --no-build

            for i in $(seq 1 15); do
              health=$(docker inspect --format='{{.State.Health.Status}}' ktk-schedule 2>/dev/null)
              if [ "$health" = "healthy" ]; then
                echo "rollback container is healthy"
                notify_deploy "ktk-schedule deploy failed and rolled back: ${GITHUB_SHA}"
                exit 1
              fi
              sleep 2
            done
            echo "rollback container failed to become healthy"
            docker compose logs --tail=50
          fi
          notify_deploy "ktk-schedule deploy failed and rollback did not recover: ${GITHUB_SHA}"
          exit 1
