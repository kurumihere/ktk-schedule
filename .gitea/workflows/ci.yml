name: CI
run-name: CI

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  GOVULNCHECK_VERSION: v1.3.0

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - run: go mod download

      - run: go mod tidy -diff

      - run: go vet ./...

      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}

      - run: golangci-lint run

      - run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}

      - run: govulncheck ./...

      - run: go test -count=1 -race ./...

      - run: go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/bot

  deploy:
    needs: check
    if: success() && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: native
    timeout-minutes: 15
    steps:
      - name: Deploy to VDS
        run: |
          cd /home/forgejo-runner/ktk-schedule

          git fetch origin master
          git reset --hard origin/master
          export KTK_SCHEDULE_IMAGE_TAG="${GITHUB_SHA}"

          previous_image=$(docker inspect ktk-schedule --format '{{.Image}}' 2>/dev/null || true)
          if [ -n "$previous_image" ]; then
            docker tag "$previous_image" ktk-schedule:rollback
            echo "rollback image tagged"
          fi

          BACKUP_DIR="/home/forgejo-runner/ktk-schedule/backups" \
            BACKUP_KEEP_COUNT=10 \
            BACKUP_KEEP_DAYS=30 \
            scripts/backup-sqlite.sh

          docker compose up --build -d

          for i in $(seq 1 30); do
            health=$(docker inspect --format='{{.State.Health.Status}}' ktk-schedule 2>/dev/null)
            if [ "$health" = "healthy" ]; then
              echo "container is healthy"
              docker image rm ktk-schedule:rollback 2>/dev/null || true
              docker image prune -f
              docker builder prune --filter "until=24h" -f
              exit 0
            fi
            sleep 2
          done
          echo "container failed to become healthy"
          docker compose logs --tail=50

          if docker image inspect ktk-schedule:rollback >/dev/null 2>&1; then
            echo "rolling back to previous image"
            docker tag ktk-schedule:rollback "ktk-schedule:${KTK_SCHEDULE_IMAGE_TAG}"
            docker compose up -d --no-build

            for i in $(seq 1 15); do
              health=$(docker inspect --format='{{.State.Health.Status}}' ktk-schedule 2>/dev/null)
              if [ "$health" = "healthy" ]; then
                echo "rollback container is healthy"
                exit 1
              fi
              sleep 2
            done
            echo "rollback container failed to become healthy"
            docker compose logs --tail=50
          fi
          exit 1
