name: CI
run-name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - run: go mod download

      - run: go mod tidy -diff

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - run: go test -count=1 -race ./...

      - run: go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/bot

  deploy:
    needs: check
    if: success() && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: native
    timeout-minutes: 15
    steps:
      - name: Deploy to VDS
        run: |
          cd /home/forgejo-runner/ktk-schedule

          git fetch origin master
          git reset --hard origin/master

          # backup database before deploy
          backup_dir="/home/forgejo-runner/ktk-schedule/backups"
          mkdir -p "$backup_dir"
          db_path=$(docker volume inspect ktk-schedule_ktk_schedule_data --format '{{.Mountpoint}}')/ktk-schedule.db
          if [ -f "$db_path" ]; then
            cp "$db_path" "$backup_dir/ktk-schedule-$(date +%Y%m%d-%H%M%S).db"
            ls -t "$backup_dir"/ktk-schedule-*.db | tail -n +6 | xargs -r rm
            echo "database backed up"
          fi

          docker compose up --build -d

          for i in $(seq 1 30); do
            health=$(docker inspect --format='{{.State.Health.Status}}' ktk-schedule 2>/dev/null)
            if [ "$health" = "healthy" ]; then
              echo "container is healthy"
              docker image prune -f
              docker builder prune --filter "until=24h" -f
              exit 0
            fi
            sleep 2
          done
          echo "container failed to become healthy"
          docker compose logs --tail=50
          exit 1
