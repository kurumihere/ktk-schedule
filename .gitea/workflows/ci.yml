name: CI
run-name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - run: go mod download

      - run: go vet ./...

      - run: go test -count=1 -race ./...

      - run: go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/bot

  deploy:
    needs: check
    if: success() && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: native
    timeout-minutes: 15
    steps:
      - name: Deploy to VDS
        run: |
          cd /home/forgejo-runner/ktk-schedule

          git fetch origin master
          git reset --hard origin/master

          docker compose up --build -d

          for i in $(seq 1 30); do
            health=$(docker inspect --format='{{.State.Health.Status}}' ktk-schedule 2>/dev/null)
            if [ "$health" = "healthy" ]; then
              echo "container is healthy"
              docker image prune -f
              docker builder prune --filter "until=24h" -f
              exit 0
            fi
            sleep 2
          done
          echo "container failed to become healthy"
          docker compose logs --tail=50
          exit 1
