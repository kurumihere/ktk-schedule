name: CI
run-name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - run: go mod download

      - run: test -z "$(gofmt -l .)" || (echo "unformatted files:" && gofmt -l . && exit 1)

      - run: go vet ./...

      - run: go test -count=1 ./...

      - run: go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/bot

  deploy:
    needs: check
    if: success() && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: native
    steps:
      - name: Deploy to VDS
        run: |
          cd /root/ktk-schedule
          git pull origin master
          docker compose up --build -d
