name: Deploy

on:
  workflow_dispatch:

concurrency: production

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DEPLOY_DIR: /home/github-runner/ktk-schedule

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx build --push --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          set -eu
          test -n "$PRODUCTION_ENV"

          install -d -m 0750 "$DEPLOY_DIR"
          umask 077
          install -m 0644 docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"
          printf '%s\n' "$PRODUCTION_ENV" > "$DEPLOY_DIR/.env"

          cd "$DEPLOY_DIR"
          export KTK_SCHEDULE_IMAGE="$IMAGE:$GITHUB_SHA"
          on_error() {
            docker compose start >/dev/null 2>&1 || true
            docker compose logs --tail=100 || true
          }
          trap on_error ERR
          docker compose pull

          if docker volume inspect ktk-schedule-data >/dev/null 2>&1; then
            install -d -m 0700 "$DEPLOY_DIR/backups"
            docker compose stop --timeout 15

            backup_file="ktk-schedule-$(date -u +%Y%m%dT%H%M%SZ).tar.gz"
            docker run --rm \
              --volume ktk-schedule-data:/data:ro \
              --volume "$DEPLOY_DIR/backups:/backup" \
              alpine:3.24.1 \
              tar -czf "/backup/$backup_file" -C /data .

            find "$DEPLOY_DIR/backups" -type f -name 'ktk-schedule-*.tar.gz' -mtime +14 -delete
          fi

          docker compose up -d --wait --wait-timeout 90 --remove-orphans --no-build
          docker image prune -af --filter "label=org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
