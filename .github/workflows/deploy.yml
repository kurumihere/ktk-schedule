name: Deploy

on:
  workflow_dispatch:

concurrency: production

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DEPLOY_DIR: /home/github-runner/ktk-schedule

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx build --push --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          set -eu
          test -n "$PRODUCTION_ENV"

          install -d -m 0750 "$DEPLOY_DIR"
          umask 077
          install -m 0644 docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"
          printf '%s\n' "$PRODUCTION_ENV" > "$DEPLOY_DIR/.env"

          cd "$DEPLOY_DIR"
          export KTK_SCHEDULE_IMAGE="$IMAGE:$GITHUB_SHA"
          trap 'docker compose logs --tail=100 || true' ERR
          docker compose pull
          docker compose up -d --wait --wait-timeout 90 --remove-orphans --no-build
          docker image prune -af --filter "label=org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
