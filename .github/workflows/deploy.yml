name: Deploy to VDS

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target (test or prod)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod

permissions:
  contents: read

concurrency:
  group: deploy-vds
  cancel-in-progress: false

jobs:
  audit:
    uses: ./.github/workflows/security.yml

  build:
    needs: audit
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    container: debian:13-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.binary.outputs.sha256 }}
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential cmake curl git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Check
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
      - name: Build
        run: cargo build --locked --release
      - name: Describe the binary
        id: binary
        run: |
          ./target/release/ktk-schedule --version
          echo "sha256=$(sha256sum target/release/ktk-schedule | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bot
          path: target/release/ktk-schedule
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, x64, ktk-deploy]
    environment: ${{ inputs.target }}
    timeout-minutes: 10
    env:
      TARGET: ${{ inputs.target }}
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bot
          path: release
      - name: Verify the artifact
        run: echo "$SHA256  release/ktk-schedule" | sha256sum --check --strict
      # Rehearses the migration on a copy, backs up, swaps, waits for READY and rolls back on failure.
      - name: Install and restart
        run: sudo -n /usr/local/sbin/ktk-schedule-deploy "$TARGET" < release/ktk-schedule
      - name: Clean workspace
        if: always()
        run: rm -rf release
