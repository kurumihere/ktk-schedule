name: deploy

on:
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DEPLOY_DIR: /home/github-runner/ktk-schedule

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push docker-image
        run: |
          docker buildx build \
            --push \
            --pull \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" \
            --tag "$IMAGE:latest" \
            .

  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: deploy
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          set -Eeuo pipefail
          test -n "$PRODUCTION_ENV"

          install -d -m 0750 "$DEPLOY_DIR"
          install -m 0644 docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"
          cd "$DEPLOY_DIR"
          umask 077

          rollback_env="$DEPLOY_DIR/.env.rollback"
          next_env="$DEPLOY_DIR/.env.next"
          rm -f "$rollback_env" "$next_env"

          previous_image=""
          if [ -f .env ]; then
            previous_container="$(docker compose ps -q ktk-schedule 2>/dev/null || true)"
            if [ -n "$previous_container" ]; then
              previous_image="$(docker inspect --format '{{.Config.Image}}' "$previous_container")"
            fi

            cp .env "$rollback_env"
            if [ -n "$previous_image" ]; then
              printf '\nKTK_SCHEDULE_IMAGE=%s\n' "$previous_image" >> "$rollback_env"
            fi
          fi

          printf '%s\nKTK_SCHEDULE_IMAGE=%s\n' \
            "$PRODUCTION_ENV" "$IMAGE:$GITHUB_SHA" > "$next_env"
          mv "$next_env" .env

          rollback() {
            status=$?
            trap - ERR
            docker compose logs --tail=100 || true
            if [ -f "$rollback_env" ]; then
              echo "Deployment failed; restoring $previous_image"
              mv "$rollback_env" .env
              docker compose up -d --remove-orphans --no-build || true
            else
              docker compose stop --timeout 15 || true
            fi
            exit "$status"
          }
          trap rollback ERR

          docker compose pull

          if docker volume inspect ktk-schedule-data >/dev/null 2>&1; then
            install -d -m 0700 "$DEPLOY_DIR/backups"
            docker compose stop --timeout 30

            backup_file="ktk-schedule-$(date -u +%Y%m%dT%H%M%SZ).tar.gz"
            docker run --rm \
              --volume ktk-schedule-data:/data:ro \
              --volume "$DEPLOY_DIR/backups:/backup" \
              alpine:3.24.1 \
              tar -czf "/backup/$backup_file" -C /data .

            find "$DEPLOY_DIR/backups" -type f -name 'ktk-schedule-*.tar.gz' -mtime +14 -delete
          fi

          docker compose up -d --remove-orphans --no-build

          container_id="$(docker compose ps -q ktk-schedule)"
          test -n "$container_id"
          for attempt in $(seq 1 15); do
            sleep 2
            test "$(docker inspect --format '{{.State.Running}}' "$container_id")" = "true"
            test "$(docker inspect --format '{{.RestartCount}}' "$container_id")" = "0"
          done

          trap - ERR
          rm -f "$rollback_env"
          docker image prune -af \
            --filter "until=168h" \
            --filter "label=org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
