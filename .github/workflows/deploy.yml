name: Deploy to VDS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vds
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    container: debian:13-slim
    timeout-minutes: 30
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential cmake curl git ca-certificates openssh-client
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Check and build
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo build --locked --release
      - name: Deploy and restart
        env:
          VDS_HOST: ${{ secrets.VDS_HOST }}
          VDS_PORT: ${{ secrets.VDS_PORT }}
          VDS_USER: ${{ secrets.VDS_USER }}
          VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
          VDS_KNOWN_HOSTS: ${{ secrets.VDS_KNOWN_HOSTS }}
        run: |
          umask 077
          key="$RUNNER_TEMP/ktk-deploy-key"
          hosts="$RUNNER_TEMP/ktk-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$VDS_SSH_KEY" > "$key"
          printf '%s\n' "$VDS_KNOWN_HOSTS" > "$hosts"
          ssh -i "$key" -p "$VDS_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$VDS_USER@$VDS_HOST" deploy < target/release/ktk-schedule
