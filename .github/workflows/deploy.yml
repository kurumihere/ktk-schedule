name: Deploy to VDS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vds
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    container: debian:13-slim
    timeout-minutes: 30
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential cmake curl git ca-certificates
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Check and build
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo build --locked --release
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: bot
          path: target/release/ktk-schedule
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, x64, ktk-deploy]
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: bot
          path: release
      - name: Install and restart
        run: |
          sudo -n /usr/local/sbin/ktk-schedule-deploy < release/ktk-schedule
      - name: Clean workspace
        if: always()
        run: rm -rf release
