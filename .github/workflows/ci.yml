name: Continuous Integration
run-name: CI / ${{ github.ref_name }}

on:
  push:
    branches: [master]
    paths-ignore:
      - README.md
      - README.en.md
      - LICENSE
      - .gitattributes
      - .gitignore
      - docs/**
  pull_request:
    branches: [master]
    paths-ignore:
      - README.md
      - README.en.md
      - LICENSE
      - .gitattributes
      - .gitignore
      - docs/**
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26.4"
  GOLANGCI_LINT_VERSION: v2.12.2
  GOVULNCHECK_VERSION: v1.3.0

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Add Go tools to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Download packages
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            sleep "$((attempt * 5))"
          done
          go mod download

      - name: Install tools
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}

      - name: Check module files
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: golangci-lint run

      - name: Vulnerability scan
        if: github.event_name != 'pull_request'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          govulncheck ./...

      - name: Compile
        run: go build -trimpath -ldflags="-s -w" -o /tmp/ktk-schedule ./cmd/bot

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download packages
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            sleep "$((attempt * 5))"
          done
          go mod download

      - name: Test
        run: go test -count=1 -race -shuffle=on ./...
