name: Set up Rust
description: >-
  Install a checksum-verified rustup; cargo then installs the toolchain pinned in
  rust-toolchain.toml on first use.
runs:
  using: composite
  steps:
    - name: Install rustup
      shell: bash
      run: |
        set -euo pipefail
        curl --proto '=https' --tlsv1.2 -sSf https://static.rust-lang.org/rustup/archive/1.29.3/x86_64-unknown-linux-gnu/rustup-init -o /tmp/rustup-init
        echo "b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55  /tmp/rustup-init" | sha256sum --check --strict
        chmod 700 /tmp/rustup-init
        /tmp/rustup-init -y --profile minimal --default-toolchain none
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
