services:
  ktk-schedule:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${KTK_SCHEDULE_IMAGE:-ktk-schedule:local}
    restart: unless-stopped
    read_only: true
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/ktk-schedule.db
    volumes:
      - data:/app/data

volumes:
  data:
    name: ktk-schedule-data
