root = "."
tmp_dir = "tmp"

[build]
  bin = "tmp/ktk-schedule"
  cmd = "go build -trimpath -ldflags=\"-s -w\" -o ./tmp/ktk-schedule ./cmd/bot"
  delay = 300
  exclude_dir = ["assets", "tmp", "vendor", "data"]
  exclude_file = []
  exclude_regex = ["_test.go", "\\.db$"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = ["internal", "cmd"]
  include_ext = ["go"]
  include_file = ["go.mod", "go.sum"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "green"
  runner = "cyan"
  watcher = "magenta"

[log]
  time = false

[misc]
  clean_on_exit = true
